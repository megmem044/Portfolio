name: ClearSpend CI

on:
  pull_request:
    paths:
      - "clearspend/**"
      - ".github/workflows/clearspend-ci.yml"
  push:
    branches: [main]
    paths:
      - "clearspend/**"
      - ".github/workflows/clearspend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: clearspend

jobs:
  backend-quality:
    name: Backend lint and SQLite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clearspend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests scripts migrations
      - run: python -m pytest

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: transactions_test
          POSTGRES_USER: transaction_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transaction_app -d transactions_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://transaction_app:test_password@localhost:5432/transactions_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clearspend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: transactions_migrations
          POSTGRES_USER: transaction_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transaction_app -d transactions_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://transaction_app:test_password@localhost:5432/transactions_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clearspend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m alembic check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearspend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clearspend/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
