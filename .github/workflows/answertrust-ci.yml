name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: answertrust
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: answertrust_test
          POSTGRES_USER: answertrust
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U answertrust -d answertrust_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://answertrust:test-password@127.0.0.1:5432/answertrust_test
      TEST_DATABASE_URL: postgresql+psycopg://answertrust:test-password@127.0.0.1:5432/answertrust_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: answertrust/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: answertrust/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: answertrust/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: answertrust
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build
