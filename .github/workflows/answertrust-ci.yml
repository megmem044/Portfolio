name: AnswerTrust CI

on:
  push:
    paths:
      - "answertrust/**"
      - ".github/workflows/answertrust-ci.yml"
  pull_request:
    paths:
      - "answertrust/**"
      - ".github/workflows/answertrust-ci.yml"

concurrency:
  group: answertrust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: answertrust
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: answertrust_test
          POSTGRES_USER: answertrust
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U answertrust -d answertrust_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://answertrust:test-password@127.0.0.1:5432/answertrust_test
      TEST_DATABASE_URL: postgresql+psycopg://answertrust:test-password@127.0.0.1:5432/answertrust_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: answertrust/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  frontend:
    name: Frontend and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: answertrust/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: answertrust/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: answertrust-playwright-report
          path: answertrust/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: answertrust
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build
