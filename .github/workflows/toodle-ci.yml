# Tests every Toodle layer and verifies that production images still build.
name: Toodle CI

on:
  pull_request:
    paths:
      - "toodle/**"
      - ".github/workflows/toodle-ci.yml"
  push:
    branches: [main]
    paths:
      - "toodle/**"
      - ".github/workflows/toodle-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            toodle/frontend/package-lock.json
            toodle/bff/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and build frontend
        working-directory: toodle/frontend
        run: npm ci && npm test && npm run build
      - name: Install Playwright browser
        working-directory: toodle/frontend
        run: npx playwright install --with-deps chromium
      - name: Test frontend keyboard workflows
        working-directory: toodle/frontend
        run: npm run test:e2e
      - name: Test backend and export OpenAPI contract
        working-directory: toodle/backend
        run: mvn -s maven-settings.xml test
      - name: Test BFF and verify generated API types
        working-directory: toodle/bff
        run: npm ci && npm test && npm run build
      - name: Build production images
        working-directory: toodle
        env:
          POSTGRES_PASSWORD: ci-build-only-password
          JWT_SECRET: ci-build-only-jwt-secret-that-is-long-enough-for-hmac-sha-256
        run: docker compose -f compose.production.yaml build
