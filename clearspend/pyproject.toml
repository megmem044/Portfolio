[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-categorization-api"
version = "0.1.0"
description = "API for categorizing and summarizing personal transactions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic~=1.16.0",
    "email-validator~=2.2.0",
    "fastapi~=0.116.0",
    "psycopg[binary]~=3.2.0",
    "pwdlib[argon2]~=0.2.0",
    "PyJWT~=2.10.0",
    "pydantic-settings~=2.10.0",
    "python-multipart~=0.0.20",
    "sqlalchemy~=2.0.0",
    "uvicorn[standard]~=0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx~=0.28.0",
    "pytest~=8.4.0",
    "ruff~=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
