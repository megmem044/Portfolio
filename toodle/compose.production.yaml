# Runs the complete production-style Toodle stack.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toodle}
      POSTGRES_USER: ${POSTGRES_USER:-toodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:5432/${POSTGRES_DB:-toodle}
      DATABASE_USERNAME: ${POSTGRES_USER:-toodle}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SPRING_PROFILES_ACTIVE: production
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: toodle-api
      OTEL_TRACES_EXPORTER: logging
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  bff:
    build:
      context: ./bff
    environment:
      SPRING_API_URL: http://backend:8080/api
      SPRING_HEALTH_URL: http://backend:8080/actuator/health
      FRONTEND_ORIGIN: http://localhost
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: toodle-bff
      OTEL_TRACES_EXPORTER: console
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8088:80"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  benchmark:
    image: node:24-alpine
    profiles: ["benchmark"]
    working_dir: /benchmark
    command: ["node", "run.mjs"]
    environment:
      BENCHMARK_URL: http://frontend/api
      BENCHMARK_TASKS: ${BENCHMARK_TASKS:-500}
      BENCHMARK_CONCURRENCY: ${BENCHMARK_CONCURRENCY:-20}
      BENCHMARK_DURATION_SECONDS: ${BENCHMARK_DURATION_SECONDS:-30}
      BENCHMARK_SEED_CONCURRENCY: ${BENCHMARK_SEED_CONCURRENCY:-20}
      BENCHMARK_RESULT: /benchmark/results/latest.json
    volumes:
      - ./benchmark:/benchmark
    depends_on:
      frontend:
        condition: service_healthy

  benchmark-db-profile:
    image: postgres:16-alpine
    profiles: ["benchmark"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-toodle}", "-d", "${POSTGRES_DB:-toodle}", "-f", "/benchmark/db-profile.sql"]
    volumes:
      - ./benchmark:/benchmark:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
