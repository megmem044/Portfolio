# Runs the PostgreSQL database used for local backend development.
services:
  postgres:
    image: postgres:16-alpine
    container_name: toodle-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toodle}
      POSTGRES_USER: ${POSTGRES_USER:-toodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toodle}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
