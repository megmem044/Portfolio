# Production profile keeps operational request summaries while suppressing framework and SQL debug noise.
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

# Production logging and runtime settings for the Spring API.
spring:
  datasource:
    url: jdbc:${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false

toodle:
  jwt:
    secret: ${JWT_SECRET}
