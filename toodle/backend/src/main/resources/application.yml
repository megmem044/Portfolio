# Shared Spring settings for local development and tests.
server:
  port: ${PORT:8080}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    # Render supplies postgresql://; Spring's driver needs the jdbc: prefix.
    url: jdbc:${DATABASE_URL:postgresql://localhost:5433/toodle}
    username: ${DATABASE_USERNAME:toodle}
    password: ${DATABASE_PASSWORD:toodle}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

toodle:
  jwt:
    secret: ${JWT_SECRET:toodle-local-development-secret-key-change-before-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# Tracing is off by default for local work. Production enables it explicitly.
otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  service:
    name: ${OTEL_SERVICE_NAME:toodle-api}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  instrumentation:
    jdbc:
      statement-sanitizer:
        enabled: true
    http:
      client:
        capture-request-headers: []
        capture-response-headers: []
      server:
        capture-request-headers: []
        capture-response-headers: []

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

info:
  app:
    name: Toodle API
    version: "@project.version@"

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"
